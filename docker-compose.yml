services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shifaa
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shifaa_dev}
      POSTGRES_DB: shifaa
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shifaa -d shifaa"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://shifaa:${DB_PASSWORD:-shifaa_dev}@db:5432/shifaa
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "5000:5000"
    restart: unless-stopped
volumes:
  pgdata:
